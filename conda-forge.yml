bot:
  abi_migration_branches:
    - '12.9'
  version_updates:
    allowed_tag_globs: v*
conda_build:
  pkg_format: '2'
conda_build_tool: rattler-build
conda_install_tool: pixi
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
noarch_platforms:
  - linux_64
  - linux_aarch64
  - win_64
  - win_arm64
provider:
  win_64: github_actions
  win_arm64: github_actions
  linux_aarch64: github_actions
workflow_settings:
  free_disk_space: quick
  pagefile_size:
    - os: linux
      value: 10
