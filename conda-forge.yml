bot:
  abi_migration_branches:
    - '12.9'
  version_updates:
    allowed_tag_globs: v*
build_platform:
  linux_ppc64le: linux_64
conda_build:
  pkg_format: '2'
conda_build_tool: rattler-build
conda_install_tool: pixi
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
noarch_platforms:
  - linux_64
  - linux_aarch64
  - win_64
provider:
  linux_aarch64: default
  linux_ppc64le: azure
workflow_settings:
  free_disk_space: quick
  pagefile_size:
    - os: linux
      value: 10
