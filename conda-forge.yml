conda_build:
  pkg_format: '2'
conda_build_tool: rattler-build
conda_forge_output_validation: true
conda_install_tool: pixi
github:
  branch_name: main
  tooling_branch_name: main
noarch_platforms:
- linux_64
- linux_aarch64
- win_64
provider:
  linux_aarch64: github_actions
workflow_settings:
  free_disk_space:
  - os: win
    value: quick
  - os: linux
    value: skip
